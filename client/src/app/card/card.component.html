<div class="outer">
  <div class="rounded shadow card-wrapper" [class.flipped]="isFlipped()"
    [style.transition-delay.ms]="flipDelay() * delayMultiplier">
    <div class="p-2 w-100 h-100 card front" [class]="colorClasses()">
      @if (card(); as currentCard) {
      <div class="position-relative w-100 h-100 fs-4">
        <strong class="position-absolute top-0 start-0">{{currentCard.number}}</strong>
        <strong class="position-absolute top-0 end-0">{{currentCard.number}}</strong>
        <strong class="position-absolute bottom-0 start-0">{{currentCard.number}}</strong>
        <strong class="position-absolute bottom-0 end-0">{{currentCard.number}}</strong>
      </div>
      } @else {
        <div class="w-100 h-100 d-flex justify-content-center align-items-center back">
          <span class="text-danger fs-1">!</span>
        </div>
      }
    </div>
    <div class="w-100 h-100 d-flex justify-content-center align-items-center card back hanabi-card-back">
      <span class="fs-1">?</span>
    </div>
  </div>
</div>
