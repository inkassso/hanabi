<div class="w-100 h-100">
  <div class="d-flex justify-content-center">
    <div class="mx-5 tokens">
      <div class="note">Note tokens: <strong>{{game().noteTokens()}}</strong></div>
      <div class="storm">Storm tokens: <strong>{{game().stormTokens()}}</strong></div>
    </div>
    <div class="mx-5 draw-discard-cards">
      <div class="draw-deck">Draw Deck: <strong>{{game().drawDeck.cards.length}}</strong></div>
      <div class="discard-pile">Discard Pile: <strong>{{game().discardPile.cards().length}}</strong></div>
    </div>
  </div>
  <app-firework-board [fireworks]="game().gameBoard.fireworks()" class="my-3"></app-firework-board>
  <hr />
  <app-player-board [players]="game().players" [activePlayer]="game().activePlayer()"></app-player-board>
</div>
